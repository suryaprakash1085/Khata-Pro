kind = "web"
previewPath = "/"
title = "KhataPro Admin Panel"
version = "1.0.0"
id = "artifacts/khata-admin"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23103

[services.development]
run = "pnpm --filter @workspace/khata-admin run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/khata-admin", "run", "build" ]
serve = "static"
publicDir = "artifacts/khata-admin/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23103"
BASE_PATH = "/"
