kind = "mobile"
previewPath = "/khata-mobile/"
title = "KhataPro"
version = "1.0.0"
id = "artifacts/khata-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/khata-mobile/" ]
localPort = 24543

[services.development]
run = "pnpm --filter @workspace/khata-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/khata-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/khata-mobile", "run", "serve" ]

[services.env]
PORT = "24543"
BASE_PATH = "/khata-mobile/"
