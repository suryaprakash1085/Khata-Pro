  # ── Driver delivery-flow endpoints (delivery-app) ──────────────────────────

  /deliveries/my:
    get:
      operationId: listMyDeliveries
      tags: [deliveries]
      summary: List deliveries assigned to the authenticated driver
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, assigned, picked_up, in_transit, delivered, cancelled]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of the driver's deliveries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryListResponse"

  /deliveries/{id}/my-details:
    get:
      operationId: getMyDeliveryDetails
      tags: [deliveries]
      summary: Full delivery detail for the driver — includes customer contact and order items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Delivery detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryMyDetails"
        "404":
          description: Not found

  /deliveries/{id}/accept:
    post:
      operationId: acceptDelivery
      tags: [deliveries]
      summary: Driver accepts an assigned delivery
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Delivery accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "404":
          description: Not found
        "409":
          description: Delivery is no longer available

  /deliveries/{id}/reject:
    post:
      operationId: rejectDelivery
      tags: [deliveries]
      summary: Driver rejects an assigned delivery (returns it to the pending/admin queue)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectDeliveryInput"
      responses:
        "200":
          description: Delivery rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "404":
          description: Not found
        "409":
          description: Delivery can no longer be rejected

  /deliveries/{id}/call:
    post:
      operationId: callDeliveryCustomer
      tags: [deliveries]
      summary: Driver initiates a masked/bridged call to the customer — Exotel rings the driver first, then bridges to the customer. Neither side sees the other's real number.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Call connecting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallCustomerResult"
        "404":
          description: Not found
        "422":
          description: Driver or customer has no phone number on file
        "500":
          description: Calling is not configured
        "502":
          description: Call provider rejected the request

  /deliveries/{id}/pickup:
    post:
      operationId: pickupDelivery
      tags: [deliveries]
      summary: Driver marks the delivery as picked up from the store
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Marked as picked up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "404":
          description: Not found
        "409":
          description: Delivery must be accepted first

  /deliveries/{id}/start-delivery:
    post:
      operationId: startDeliveryTrip
      tags: [deliveries]
      summary: Driver starts the trip to the customer (out for delivery)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Delivery marked in transit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "404":
          description: Not found
        "409":
          description: Delivery must be picked up first

  /deliveries/{id}/arrived:
    post:
      operationId: markDeliveryArrived
      tags: [deliveries]
      summary: Driver marks arrival at the customer location. Auto-generates and sends the delivery OTP.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Marked as arrived, OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "404":
          description: Not found
        "409":
          description: Delivery must be in transit and not already arrived
        "422":
          description: Customer has no phone number on file
        "502":
          description: Failed to send OTP

  /deliveries/{id}/otp/resend:
    post:
      operationId: resendDeliveryOtp
      tags: [deliveries]
      summary: Resend the delivery OTP to the customer (rate-limited)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OTP resent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Not found
        "409":
          description: Resend not available at this stage
        "429":
          description: Cooldown active or max resends reached
        "502":
          description: Failed to resend OTP

  /deliveries/{id}/otp/verify:
    post:
      operationId: verifyDeliveryOtp
      tags: [deliveries]
      summary: Verify the customer-provided OTP for this delivery
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyDeliveryOtpInput"
      responses:
        "200":
          description: OTP verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "401":
          description: Incorrect or expired OTP
        "404":
          description: Not found
        "409":
          description: Not eligible for verification at this stage
        "429":
          description: Too many incorrect attempts

  /deliveries/{id}/payment:
    post:
      operationId: confirmDeliveryPayment
      tags: [deliveries]
      summary: Confirm COD payment collection for this delivery
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmDeliveryPaymentInput"
      responses:
        "200":
          description: Payment confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "404":
          description: Not found
        "409":
          description: Not COD, or already collected
        "422":
          description: Amount exceeds order total

  /deliveries/{id}/complete:
    post:
      operationId: completeDelivery
      tags: [deliveries]
      summary: Complete the delivery (requires arrival, OTP verified, and COD payment collected if applicable)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Delivery completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteDeliveryResult"
        "404":
          description: Not found
        "409":
          description: Preconditions not met (arrival / OTP / payment)

