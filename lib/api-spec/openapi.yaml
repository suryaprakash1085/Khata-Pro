openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: KhataPro CRM API — digital ledger platform for small businesses
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: businesses
    description: Business management
  - name: customers
    description: Customer ledger management
  - name: products
    description: Product and inventory management
  - name: promotions
    description: Promotions (Buy 1 Get 1 Free, percentage discounts)
  - name: vendors
    description: Vendor and supplier management
  - name: purchases
    description: Purchase records from vendors
  - name: sales-orders
    description: Online sales orders (pre-billing customer orders)
  - name: drivers
    description: Delivery driver management
  - name: deliveries
    description: Delivery tracking
  - name: transactions
    description: Ledger transactions
  - name: reports
    description: Business reports and analytics
  - name: reminders
    description: Payment reminders
  - name: admin
    description: Admin panel operations
  - name: subscriptions
    description: Subscription management
  - name: notifications
    description: Driver and business notifications
  - name: service-highlights
    description: "Why Choose Us"
  - name: delivery-fees 
    description: Distance-based delivery fee configuration and calculation
  - name: driver-notifications
    description: Driver-facing notifications (paginated, filterable, read-tracking)
  - name: admin-notifications
    description: Admin dashboard notifications (new orders, low stock, vendor payments)
  - name: order-returns
    description: Customer return requests for delivered orders (expired / wrong product etc.) and admin review
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── AUTH ───────────────────────────────────────────────────────────────────

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Admin / staff login with email + password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new admin / staff account with email + password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email or phone already in use

  /auth/send-otp:
    post:
      operationId: sendOtp
      tags: [auth]
      summary: Send OTP to phone number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpInput"
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/verify-otp:
    post:
      operationId: verifyOtp
      tags: [auth]
      summary: Verify OTP and get auth token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyInput"
      responses:
        "200":
          description: OTP verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid or expired OTP

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current user
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ─── BUSINESSES ─────────────────────────────────────────────────────────────

  /businesses:
    get:
      operationId: listBusinesses
      tags: [businesses]
      summary: List all businesses (optionally filtered by owner)
      parameters:
        - name: owner_id
          in: query
          schema:
            type: integer
        - name: staff_user_id
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of businesses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessListResponse"
    post:
      operationId: createBusiness
      tags: [businesses]
      summary: Create a new business
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessInput"
      responses:
        "201":
          description: Business created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"

  /businesses/{id}:
    get:
      operationId: getBusiness
      tags: [businesses]
      summary: Get business by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Business details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "404":
          description: Not found
    put:
      operationId: updateBusiness
      tags: [businesses]
      summary: Update business
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessUpdate"
      responses:
        "200":
          description: Updated business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"

  /businesses/{id}/stats:
    get:
      operationId: getBusinessStats
      tags: [businesses]
      summary: Get summary stats for a business (total collect, pay, net)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Business stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessStats"

  /businesses/{id}/staff:
    post:
      operationId: addStaff
      tags: [businesses]
      summary: Add a staff member to a business
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffInput"
      responses:
        "201":
          description: Staff added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"

  # ─── SUBSCRIPTIONS (business-facing) ────────────────────────────────────────

  /subscription-plans:
    get:
      operationId: listActiveSubscriptionPlans
      tags: [subscriptions]
      summary: List active subscription plans (business-facing, no admin auth)
      security: []
      responses:
        "200":
          description: Active subscription plans
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SubscriptionPlan"

  /subscriptions/me:
    get:
      operationId: getMySubscription
      tags: [subscriptions]
      summary: Get the authenticated user's business subscription, plan config, and business info
      responses:
        "200":
          description: Current subscription
          content:
            application/json:
              schema:
                type: object
                required: [subscription, plan, business]
                properties:
                  subscription:
                    $ref: "#/components/schemas/Subscription"
                  plan:
                    $ref: "#/components/schemas/SubscriptionPlan"
                  business:
                    $ref: "#/components/schemas/Business"
        "404":
          description: No subscription found for this user's business

  /subscriptions/renew:
    post:
      operationId: renewSubscription
      tags: [subscriptions]
      summary: Business owner renews or activates their subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenewSubscriptionBody"
      responses:
        "200":
          description: Subscription renewed

  /subscriptions/create-order:
    post:
      operationId: createSubscriptionOrder
      tags: [subscriptions]
      summary: Create a Razorpay order for subscription renewal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionOrderBody"
      responses:
        "200":
          description: Razorpay order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSubscriptionOrderResponse"

  /subscriptions/verify-payment:
    post:
      operationId: verifySubscriptionPayment
      tags: [subscriptions]
      summary: Verify Razorpay payment signature and activate subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifySubscriptionPaymentBody"
      responses:
        "200":
          description: Payment verified, subscription activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifySubscriptionPaymentResponse"
        "400":
          description: Signature verification failed

  # ─── SERVICE HIGHLIGHTS ─────────────────────────────────────────────────────

  /service-highlights:
    get:
      operationId: listServiceHighlights
      tags: [service-highlights]
      summary: List "Why Choose Us" highlights for the authenticated business
      responses:
        "200":
          description: List of service highlights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceHighlight"
    post:
      operationId: createServiceHighlight
      tags: [service-highlights]
      summary: Create a service highlight for the authenticated business
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceHighlightInput"
      responses:
        "201":
          description: Highlight created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceHighlight"
        "400":
          description: Validation error

  /service-highlights/{id}:
    put:
      operationId: updateServiceHighlight
      tags: [service-highlights]
      summary: Update a service highlight (must belong to the authenticated business)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceHighlightUpdate"
      responses:
        "200":
          description: Updated highlight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceHighlight"
        "404":
          description: Not found
    delete:
      operationId: deleteServiceHighlight
      tags: [service-highlights]
      summary: Delete a service highlight (must belong to the authenticated business)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Not found

  /service-highlights/{id}/status:
    patch:
      operationId: updateServiceHighlightStatus
      tags: [service-highlights]
      summary: Enable or disable a service highlight
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceHighlightStatusUpdate"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceHighlight"

  /public/businesses/{businessId}/service-highlights:
    get:
      operationId: getPublicServiceHighlights
      tags: [service-highlights]
      summary: Get active service highlights for a business (customer delivery app, no auth)
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Active service highlights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicServiceHighlight"

  # ─── DELIVERY FEES ──────────────────────────────────────────────────────────

  /delivery-fees/settings:
    get:
      operationId: getDeliveryFeeSettings
      tags: [delivery-fees]
      summary: Get the authenticated business's delivery-fee settings (creates defaults if none exist)
      responses:
        "200":
          description: Delivery fee settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryFeeSettings"
        "403":
          description: No business associated with this account
    put:
      operationId: updateDeliveryFeeSettings
      tags: [delivery-fees]
      summary: Update the authenticated business's delivery-fee settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryFeeSettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryFeeSettings"
        "422":
          description: Invalid delivery settings
        "403":
          description: No business associated with this account

  /delivery-fees/calculate:
    post:
      operationId: calculateDeliveryFee
      tags: [delivery-fees]
      summary: Calculate the delivery fee for a business + customer location (no auth — used by customer app for checkout preview)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryFeeCalculationInput"
      responses:
        "200":
          description: Calculated delivery fee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryFeeCalculation"
        "422":
          description: Shop location not configured, or invalid/missing customer location

  # ─── CUSTOMERS ──────────────────────────────────────────────────────────────

  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List customers for a business
      parameters:
        - name: business_id
          in: query
          required: true
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
            enum: [customer, supplier]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerListResponse"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Customer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get customer with ledger summary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Customer detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          description: Not found
    put:
      operationId: updateCustomer
      tags: [customers]
      summary: Update customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdate"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
    delete:
      operationId: deleteCustomer
      tags: [customers]
      summary: Delete a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ─── PRODUCTS ────────────────────────────────────────────────────────────────

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products for a business
      parameters:
        - name: business_id
          in: query
          required: true
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: low_stock
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
    put:
      operationId: updateProduct
      tags: [products]
      summary: Update product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /products/barcode/{barcode}:
    get:
      operationId: getProductByBarcode
      tags: [products]
      summary: Look up a product by barcode (for billing scan)
      parameters:
        - name: barcode
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found

  # ─── PROMOTIONS ──────────────────────────────────────────────────────────────

  /promotions:
    get:
      operationId: listPromotions
      tags: [promotions]
      summary: List promotions for a business
      parameters:
        - name: business_id
          in: query
          required: true
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of promotions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionListResponse"
    post:
      operationId: createPromotion
      tags: [promotions]
      summary: Create a promotion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromotionInput"
      responses:
        "201":
          description: Promotion created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Promotion"

  /promotions/active:
    get:
      operationId: listActivePromotions
      tags: [promotions]
      summary: Get currently-active (date + status valid) promotions for a business — used by Billing
      parameters:
        - name: business_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Active promotions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Promotion"

  /promotions/{id}:
    get:
      operationId: getPromotion
      tags: [promotions]
      summary: Get promotion by ID, including selected products
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Promotion detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Promotion"
        "404":
          description: Not found
    put:
      operationId: updatePromotion
      tags: [promotions]
      summary: Update a promotion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromotionUpdate"
      responses:
        "200":
          description: Updated promotion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Promotion"
    delete:
      operationId: deletePromotion
      tags: [promotions]
      summary: Delete a promotion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /promotions/{id}/status:
    put:
      operationId: updatePromotionStatus
      tags: [promotions]
      summary: Enable or disable a promotion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromotionStatusUpdate"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Promotion"

  # ─── VENDORS ─────────────────────────────────────────────────────────────────

  /vendors:
    get:
      operationId: listVendors
      tags: [vendors]
      summary: List vendors for a business
      parameters:
        - name: business_id
          in: query
          required: true
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of vendors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorListResponse"
    post:
      operationId: createVendor
      tags: [vendors]
      summary: Create a vendor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorInput"
      responses:
        "201":
          description: Vendor created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"

  /vendors/{id}:
    get:
      operationId: getVendor
      tags: [vendors]
      summary: Get vendor by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vendor detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "404":
          description: Not found
    put:
      operationId: updateVendor
      tags: [vendors]
      summary: Update vendor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
