# ─── SCHEMAS ─────────────────────────────────────────────────────────────────

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    # ── Auth ──────────────────────────────────────────────────────────────────

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    RegisterInput:
      type: object
      required: [name, phone, email, password]
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        password:
          type: string

    OtpInput:
      type: object
      required: [phone]
      properties:
        phone:
          type: string

    OtpVerifyInput:
      type: object
      required: [phone, otp]
      properties:
        phone:
          type: string
        otp:
          type: string

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    # ── User ──────────────────────────────────────────────────────────────────

    User:
      type: object
      required: [id, name, phone, role, is_active, created_at]
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        email:
          type: ["string", "null"]
        role:
          type: string
          enum: [owner, staff, admin]
        profile_image:
          type: ["string", "null"]
        is_active:
          type: boolean
        language_pref:
          type: ["string", "null"]
        created_at:
          type: string
          format: date-time

    UserListResponse:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    # ── Business ──────────────────────────────────────────────────────────────

    Business:
      type: object
      required: [id, owner_id, business_name, business_type, currency, created_at]
      properties:
        id:
          type: integer
        owner_id:
          type: integer
        business_name:
          type: string
        business_type:
          type: string
        gstin:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        address_line1:
          type: ["string", "null"]
        address_line2:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        state:
          type: ["string", "null"]
        postal_code:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        latitude:
          type: ["number", "null"]
        longitude:
          type: ["number", "null"]
        logo_url:
          type: ["string", "null"]
        currency:
          type: string
          default: INR
        financial_year_start:
          type: ["string", "null"]
          format: date
        is_active:
          type: boolean
        plan:
          type: string
