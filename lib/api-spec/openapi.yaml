          items:
            $ref: "#/components/schemas/MonthlyGrowthPoint"
        plan_breakdown:
          $ref: "#/components/schemas/PlanBreakdown"
        recent_signups:
          type: array
          items:
            $ref: "#/components/schemas/Business"
        monthly_revenue:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyRevenuePoint"
        current_month_revenue:
          type: number
        previous_month_revenue:
          type: number
        subscription_status_breakdown:
          $ref: "#/components/schemas/SubscriptionStatusBreakdown"
        system_alerts:
          $ref: "#/components/schemas/SystemAlerts"
        recent_payments:
          type: array
          items:
            $ref: "#/components/schemas/RecentPayment"

    MonthlyRevenuePoint:
      type: object
      required: [month, amount]
      properties:
        month:
          type: string
        amount:
          type: number

    SubscriptionStatusBreakdown:
      type: object
      required: [active, trial, expiring_soon, expired, cancelled]
      properties:
        active:
          type: integer
        trial:
          type: integer
        expiring_soon:
          type: integer
        expired:
          type: integer
        cancelled:
          type: integer

    SystemAlerts:
      type: object
      required: [expiring_soon_count, failed_payments_count, suspended_businesses_count]
      properties:
        expiring_soon_count:
          type: integer
        failed_payments_count:
          type: integer
        suspended_businesses_count:
          type: integer

    RecentPayment:
      type: object
      required: [id, business_id, business_name, plan, billing_cycle, amount, payment_date, status]
      properties:
        id:
          type: integer
        business_id:
          type: integer
        business_name:
          type: string
        plan:
          type: string
          enum: [pro, premium]
        billing_cycle:
          type: string
          enum: [monthly, quarterly, half_yearly, yearly]
        amount:
          type: number
        payment_date:
          type: string
          format: date
        status:
          type: string
          enum: [paid, pending, failed]

    MonthlyGrowthPoint:
      type: object
      required: [month, businesses, users, transactions]
      properties:
        month:
          type: string
        businesses:
          type: integer
        users:
          type: integer
        transactions:
          type: integer

    PlanBreakdown:
      type: object
      required: [pro, premium, trial]
      properties:
        pro:
          type: integer
        premium:
          type: integer

    # ── Subscriptions ─────────────────────────────────────────────────────────

    Subscription:
      type: object
      required: [id, business_id, plan, billing_cycle, amount, status, start_date, end_date]
      properties:
        id:
          type: integer
        business_id:
          type: integer
        business_name:
          type: string
        plan:
          type: string
          enum: [pro, premium]
        billing_cycle:
          type: string
          enum: [monthly, quarterly, half_yearly, yearly]
        amount:
          type: number
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        trial_end_date:
          type: ["string", "null"]
          format: date
        status:
          type: string
          enum: [active, trial, expired, cancelled]
        payment_ref:
          type: ["string", "null"]

    SubscriptionUpdate:
      type: object
      properties:
        plan:
          type: string
          enum: [pro, premium]
        billing_cycle:
          type: string
          enum: [monthly, quarterly, half_yearly, yearly]
        status:
          type: string
          enum: [trial, active, expired, cancelled]
        end_date:
          type: string
          format: date

    # ── Renamed/used-once bodies for the three subscription-payment endpoints ──
    # These are now $ref'd directly by /subscriptions/renew, /subscriptions/create-order
    # and /subscriptions/verify-payment above — do NOT also inline these shapes in
    # the path's requestBody/response, or orval will generate two colliding types
    # with the same name (this was the original bug).

    RenewSubscriptionBody:
      type: object
      required: [plan, billing_cycle]
      properties:
        plan:
          type: string
          enum: [pro, premium]
        billing_cycle:
          type: string
          enum: [monthly, quarterly, half_yearly, yearly]

    CreateSubscriptionOrderBody:
      type: object
      required: [plan, billing_cycle]
      properties:
        plan:
          type: string
          enum: [pro, premium]
        billing_cycle:
          type: string
          enum: [monthly, quarterly, half_yearly, yearly]

    CreateSubscriptionOrderResponse:
      type: object
      required: [order_id, amount, currency, key_id]
      properties:
        order_id:
          type: string
        amount:
          type: integer
        currency:
          type: string
        key_id:
          type: string

    VerifySubscriptionPaymentBody:
      type: object
      required: [razorpay_order_id, razorpay_payment_id, razorpay_signature, plan, billing_cycle]
      properties:
        razorpay_order_id:
          type: string
        razorpay_payment_id:
          type: string
        razorpay_signature:
          type: string
        plan:
          type: string
          enum: [pro, premium]
        billing_cycle:
          type: string
          enum: [monthly, quarterly, half_yearly, yearly]

    VerifySubscriptionPaymentResponse:
      type: object
      required: [message, subscription]
      properties:
        message:
          type: string
        subscription:
          $ref: "#/components/schemas/Subscription"

    SubscriptionListResponse:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Subscription"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    SubscriptionPlan:
      type: object
      required:
        [id, plan, monthly_price, quarterly_price, half_yearly_price, yearly_price,
         trial_days, max_users, max_branches, max_products, max_customers,
         max_vendors, max_orders, features, is_active, created_at, updated_at]
      properties:
        id:
          type: integer
        plan:
          type: string
          enum: [pro, premium]
        monthly_price:
          type: number
        quarterly_price:
          type: number
        half_yearly_price:
          type: number
        yearly_price:
          type: number
        trial_days:
          type: integer
        max_users:
          type: integer
        max_branches:
          type: integer
        max_products:
          type: integer
        max_customers:
          type: integer
        max_vendors:
          type: integer
        max_orders:
          type: integer
        features:
          type: object
          additionalProperties:
            type: boolean
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateSubscriptionPlanInput:
      type: object
      required: [plan, monthly_price, quarterly_price, half_yearly_price, yearly_price]
      properties:
        plan:
          type: string
          enum: [pro, premium]
        monthly_price:
          type: number
        quarterly_price:
          type: number
        half_yearly_price:
          type: number
        yearly_price:
          type: number
        trial_days:
          type: integer
          default: 15
        max_users:
          type: integer
          default: -1
        max_branches:
          type: integer
          default: -1
        max_products:
          type: integer
          default: -1
        max_customers:
          type: integer
          default: -1
        max_vendors:
          type: integer
          default: -1
        max_orders:
          type: integer
          default: -1
        features:
          type: object
          additionalProperties:
            type: boolean
        is_active:
          type: boolean
          default: true

    UpdateSubscriptionPlanInput:
      type: object
      properties:
        monthly_price:
          type: number
        quarterly_price:
          type: number
        half_yearly_price:
          type: number
        yearly_price:
          type: number
        trial_days:
          type: integer
        max_users:
          type: integer
        max_branches:
          type: integer
        max_products:
          type: integer
        max_customers:
          type: integer
        max_vendors:
          type: integer
        max_orders:
          type: integer
        features:
          type: object
          additionalProperties:
            type: boolean
        is_active:
          type: boolean

    UpdateSubscriptionPlanStatusInput:
      type: object
      required: [is_active]
      properties:
        is_active:
          type: boolean

    # ── Audit ─────────────────────────────────────────────────────────────────

    AuditLog:
      type: object
      required: [id, action, entity_type, created_at]
      properties:
        id:
          type: integer
        business_id:
          type: ["integer", "null"]
        user_id:
          type: ["integer", "null"]
        user_name:
          type: ["string", "null"]
        action:
          type: string
        entity_type:
          type: string
        entity_id:
          type: ["integer", "null"]
        old_value:
          type: ["string", "null"]
        new_value:
          type: ["string", "null"]
        created_at:
          type: string
          format: date-time

    AuditLogListResponse:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    BroadcastInput:
      type: object
      required: [title, body, channel]
      properties:
        title:
          type: string
        body:
          type: string
        channel:
          type: string
          enum: [push, sms, all]
        target_plan:
          type: string
          enum: [pro, premium, all]
          default: all