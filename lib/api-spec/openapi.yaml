  # ─── ORDER RETURNS ──────────────────────────────────────────────────────────

  /customers/me/orders/{id}/return:
    post:
      operationId: requestOrderReturn
      tags: [order-returns]
      summary: Customer requests a return for one or more products of a delivered order (within 24h of delivery; at least 1 photo and 1 video required)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderReturnInput"
      responses:
        "201":
          description: Return requested (one entry per returned product)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderReturnCreateResponse"
        "400":
          description: Invalid reason, description missing for OTHER, or product not part of this order
        "404":
          description: Order not found
        "409":
          description: Order not delivered, 24h return window expired, or return already requested for a product
        "422":
          description: At least one photo and one video are required

  /order-returns:
    get:
      operationId: listOrderReturns
      tags: [order-returns]
