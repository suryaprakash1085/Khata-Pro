# ─── SCHEMAS ─────────────────────────────────────────────────────────────────

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    # ── Auth ──────────────────────────────────────────────────────────────────

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string

        password:
          type: string

    RegisterInput:
      type: object
      required: [name, phone, email, password]
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        password:
          type: string

    OtpInput:
      type: object
      required: [phone]
      properties:
        phone:
          type: string

    OtpVerifyInput:
      type: object
      required: [phone, otp]
      properties:
        phone:
          type: string
        otp:
          type: string

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    # ── User ──────────────────────────────────────────────────────────────────

    User:
      type: object
      required: [id, name, phone, role, is_active, created_at]
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        email:
          type: ["string", "null"]
        role:
          type: string
          enum: [owner, staff, admin]
        profile_image:
          type: ["string", "null"]
        is_active:
          type: boolean
        language_pref:
          type: ["string", "null"]
        created_at:
          type: string
          format: date-time

    UserListResponse:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    # ── Business ──────────────────────────────────────────────────────────────

    Business:
      type: object
      required: [id, owner_id, business_name, business_type, currency, created_at]
      properties:
        id:
          type: integer
        owner_id:
          type: integer
        business_name:
          type: string
        business_type:
          type: string
        gstin:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        logo_url:
          type: ["string", "null"]
        currency:
          type: string
          default: INR
        financial_year_start:
          type: ["string", "null"]
          format: date
        is_active:
          type: boolean
        plan:
          type: string
          enum: [free, pro, premium]
        created_at:
          type: string
          format: date-time

    BusinessInput:
      type: object
      required: [business_name, business_type]
      properties:
        business_name:
          type: string
        business_type:
          type: string
        gstin:
          type: string
        address:
          type: string
        logo_url:
          type: string
        currency:
          type: string
          default: INR
        financial_year_start:
          type: string
          format: date

    BusinessUpdate:
      type: object
      properties:
        business_name:
          type: string
        business_type:
          type: string
        gstin:
          type: string
        address:
          type: string
        logo_url:
          type: string
        currency:
          type: string
        financial_year_start:
          type: string
          format: date

    BusinessStats:
      type: object
      required: [total_to_collect, total_to_pay, net_balance, today_sales, customer_count, transaction_count]
      properties:
        total_to_collect:
          type: number
        total_to_pay:
          type: number
        net_balance:
          type: number
        today_sales:
          type: number
        customer_count:
          type: integer
        transaction_count:
          type: integer

    BusinessListResponse:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Business"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    AdminBusinessListResponse:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminBusiness"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    AdminBusiness:
      type: object
      required: [id, business_name, business_type, owner_name, plan, is_active, created_at]
      properties:
        id:
          type: integer
        business_name:
          type: string
        business_type:
          type: string
        owner_name:
          type: string
        owner_phone:
          type: string
        plan:
          type: string
          enum: [free, pro, premium]
        is_active:
          type: boolean
        customer_count:
          type: integer
        transaction_count:
          type: integer
        created_at:
          type: string
          format: date-time

    StaffInput:
      type: object
      required: [user_id, permissions]
      properties:
        user_id:
          type: integer
        permissions:
          $ref: "#/components/schemas/StaffPermissions"

    StaffMember:
      type: object
      required: [id, business_id, user_id, permissions]
      properties:
        id:
          type: integer
        business_id:
          type: integer
        user_id:
          type: integer
        user:
          $ref: "#/components/schemas/User"
        permissions:
          $ref: "#/components/schemas/StaffPermissions"

    StaffPermissions:
      type: object
      properties:
        add_entry:
          type: boolean
        delete_entry:
          type: boolean
        view_reports:
          type: boolean
        manage_customers:
          type: boolean

    StatusUpdate:
      type: object
      required: [is_active]
      properties:
        is_active:
          type: boolean

    # ── Customer ──────────────────────────────────────────────────────────────

    Customer:
      type: object
      required: [id, business_id, name, phone, current_balance, category, created_at]
      properties:
        id:
          type: integer
        business_id:
          type: integer
        name:
          type: string
        phone:
          type: string
        email:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        opening_balance:
          type: number
        opening_balance_type:
          type: string
          enum: [credit, debit]
        current_balance:
          type: number
        category:
          type: string
          enum: [customer, supplier]
        profile_image:
          type: ["string", "null"]
        created_at:
          type: string
          format: date-time

    CustomerInput:
      type: object
      required: [business_id, name, phone, category]
      properties:
        business_id:
          type: integer
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        address:
          type: string
        opening_balance:
          type: number
          default: 0
        opening_balance_type:
          type: string
          enum: [credit, debit]
          default: credit
        category:
          type: string
          enum: [customer, supplier]
          default: customer

    CustomerUpdate:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        address:
          type: string
        category:
          type: string
          enum: [customer, supplier]

    CustomerListResponse:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Customer"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    # ── Product ───────────────────────────────────────────────────────────────

    Product:
      type: object
      required: [id, business_id, name, unit, gst_rate, cost_price, selling_price, stock_qty, created_at]
      properties:
        id:
          type: integer
        business_id:
          type: integer
        name:
          type: string
        barcode:
          type: ["string", "null"]
        sku:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        brand:
          type: ["string", "null"]
        unit:
          type: string
          enum: [pcs, kg, g, l, ml, pkt, box, bottle, dozen]
        hsn_code:
          type: ["string", "null"]
        gst_rate:
          type: number
        cost_price:
          type: number
        selling_price:
          type: number
        stock_qty:
          type: integer
        low_stock_alert:
          type: integer
        image:
          type: ["string", "null"]
        created_at:
          type: string
          format: date-time

    ProductInput:
      type: object
      required: [business_id, name, unit, selling_price]
      properties:
        business_id:
          type: integer
        name:
          type: string
        barcode:
          type: string
        sku:
          type: string
        category:
          type: string
        brand:
          type: string
        unit:
          type: string
          enum: [pcs, kg, g, l, ml, pkt, box, bottle, dozen]
          default: pcs
        hsn_code:
          type: string
        gst_rate:
          type: number
          default: 0
        cost_price:
          type: number
          default: 0
        selling_price:
